apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/lightspeed-rag-content?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "main"
  labels:
    appstudio.openshift.io/application: rag-tool
    appstudio.openshift.io/component: lightspeed-rag-content
    pipelines.appstudio.openshift.io/type: build
  name: lightspeed-rag-content-on-pull-request
  namespace: crt-nshift-lightspeed-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/lightspeed-rag-content:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Containerfile
  - name: path-context
    value: .
  - name: hermetic
    value: "true"
  - name: build-args
    value:
    - HERMETIC=true
  - name: build-source-image
    value: "true"
  - name: enable-package-registry-proxy
    value: "true"
  - name: prefetch-input
    value: |-
      [
        {
          "type": "gomod",
          "path": "."
        },
        {
          "type": "rpm",
          "path": "."
        }
      ]
  pipelineSpec:
    description: |
      Build the BYOK RAG tool (Go) container image.

      Uses buildah with trusted artifacts. Go modules are prefetched by cachi2
      (gomod); the faiss + onnxruntime native libraries are compiled from
      vendored source in the build. RPM toolchain (gcc, cmake, openblas-devel)
      is prefetched via cachi2 rpm.
    params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: .
      description: Path to the source code of an application's component from where to build image.
      name: path-context
      type: string
    - default: Dockerfile
      description: Path to the Dockerfile inside the context specified by parameter path-context
      name: dockerfile
      type: string
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "false"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time
      name: image-expires-after
      type: string
    - default: "false"
      description: Build a source image.
      name: build-source-image
      type: string
    - default: []
      description: Array of --build-arg values ("arg=value" strings) for buildah
      name: build-args
      type: array
    - default: "true"
      description: Use the package registry proxy when prefetching dependencies
      name: enable-package-registry-proxy
      type: string
    tasks:
    - name: prefetch-dependencies
      params:
      - name: input
        value: $(params.prefetch-input)
      - name: source-artifact
        value: $(tasks.git-clone.results.EXECUTOR)
      taskRef:
        params:
        - name: name
          value: prefetch-dependencies
        - name: package
          value: konflux-ci.dev
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies
        kind: Task
        resolver: bundles
      when:
      - input: $(params.enable-package-registry-proxy)
        operator: in
        values:
        - "true"
    - name: build-image-index
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: DOCKERFILE
        value: $(params.dockerfile)
      - name: CONTEXT
        value: $(params.path-context)
      - name: HERMETIC
        value: $(params.hermetic)
      - name: BUILD_ARGS
        value:
        - $(params.build-args[*])
      taskRef:
        params:
        - name: name
          value: build-image-index
        - name: package
          value: konflux-ci.dev
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-build-image-index
        kind: Task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: build-source-image
      params:
      - name: IMAGE
        value: $(params.output-image)
      taskRef:
        params:
        - name: name
          value: source-image
        - name: package
          value: konflux-ci.dev
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-source-image
        kind: Task
        resolver: bundles
      when:
      - input: $(params.build-source-image)
        operator: in
        values:
        - "true"
  finally:
  - name: show-results
    params:
    - name: pipelinerun-name
      value: $(context.pipelineRun.name)
    taskRef:
      params:
      - name: name
        value: show-sbom
      - name: package
        value: konflux-ci.dev
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-show-sbom
      kind: Task
      resolver: bundles
