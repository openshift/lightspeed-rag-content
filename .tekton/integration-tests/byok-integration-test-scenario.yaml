apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: byok-customer-integration-test
  namespace: crt-nshift-lightspeed-tenant
spec:
  application: rag-tool
  contexts:
    - name: component_lightspeed-rag-tool
      description: Customer BYOK archive generation and grounded OLS retrieval.
  params:
    # Released OLS service from the operator v1.1.5 bundle.
    - name: ols-service-image
      value: registry.redhat.io/openshift-lightspeed/lightspeed-service-api-rhel9@sha256:13e7d109d89454d3ae34b609b9968f5d0fd93cc3ab17e7c32c4e78d311b45ba6
    - name: ubi-base-image
      value: registry.access.redhat.com/ubi9/ubi@sha256:11cbe53da8622da829ad79fafda1c5124275278f9416597ccc3d6396a6cc2c4b
    - name: openai-secret
      value: openai
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/openshift/lightspeed-rag-content.git
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/integration-tests/pipelines/byok-integration-test.yaml
