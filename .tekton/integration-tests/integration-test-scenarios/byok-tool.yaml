# Apply to the Konflux tenant namespace after the pipeline file is available in
# the resolver repo/revision. To exercise an unmerged PR, temporarily point the
# resolver URL/revision at the contributor's fork/branch instead of upstream/main.
# This resource is not created just by merging this file.
---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: byok-tool-integration-tests
  namespace: crt-nshift-lightspeed-tenant
spec:
  application: rag-tool
  contexts:
    - name: component_lightspeed-rag-tool
      description: Test the built BYOK tool image on pull requests and pushes.
  params:
    - name: test-name
      value: byok-tool-integration-tests
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/openshift/lightspeed-rag-content.git
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/integration-tests/pipeline/byok-tool-integration-test.yaml
