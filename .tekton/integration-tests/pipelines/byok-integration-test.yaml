apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: byok-integration-test
  namespace: crt-nshift-lightspeed-tenant
spec:
  description: |
    BYOK customer-workflow e2e test: run the Go tool image, load the output,
    start the real OLS service with the generated index, and verify the
    answer contains the fictional recovery phrase with the correct citation.
  params:
    - name: snapshot
      type: string
      description: The SNAPSHOT containing the tool image and source.
    - name: ols-service-image
      type: string
      description: Digest-pinned OLS service image.
    - name: openai-secret
      type: string
      default: openai
      description: Name of the secret containing the OpenAI API key.
  tasks:
    - name: extract-snapshot
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/lightspeed-rag-content
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/integration-tests/scripts/extract-snapshot.yaml
      params:
        - name: snapshot
          value: $(params.snapshot)
    - name: run-e2e
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/lightspeed-rag-content
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/integration-tests/scripts/run-in-vm.yaml
      params:
        - name: tool-image
          value: $(tasks.extract-snapshot.results.tool-image)
        - name: ols-service-image
          value: $(params.ols-service-image)
        - name: openai-secret
          value: $(params.openai-secret)
      runAfter:
        - extract-snapshot
  results:
    - name: TEST_OUTPUT
      value: $(tasks.run-e2e.results.TEST_OUTPUT)
