llm_providers:
  - name: openai
    type: openai
    url: https://api.openai.com/v1
    credentials_path: /credentials/openai-api-key
    models:
      - name: gpt-4o-mini
        parameters:
          temperature: 0
ols_config:
  max_workers: 1
  default_provider: openai
  default_model: gpt-4o-mini
  conversation_cache:
    type: memory
    memory:
      max_entries: 10
  reference_content:
    embeddings_model_path: /app-root/embeddings_model/all-mpnet-base-v2
    indexes:
      - product_docs_index_path: /rag/vector_db
        product_docs_index_id: byok-e2e-index
        product_docs_origin: fictional-byok
  user_data_collection:
    feedback_disabled: true
    transcripts_disabled: true
dev_config:
  disable_auth: true
  disable_tls: true
  run_on_localhost: true
  uvicorn_port_number: 18080
